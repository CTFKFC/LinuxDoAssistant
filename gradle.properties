# ============================================================================
# Gradle 构建配置
#
# 本文件是**通用默认值**。本地专属配置（代理、内存调优）请写到你自己的
# ~/.gradle/gradle.properties —— 那里的设置会覆盖这里，且不会进版本库。
# ============================================================================

# ---------------------------------------------------------------------------
# JVM
#
# 默认 2GB，适合大多数开发机。
# 内存紧张（≤ 4GB）时请调低，并参考 README 的「低内存机器」一节。
# ---------------------------------------------------------------------------
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8

# ---------------------------------------------------------------------------
# 构建性能
# ---------------------------------------------------------------------------
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.daemon=true

# ---------------------------------------------------------------------------
# Android
# ---------------------------------------------------------------------------
android.useAndroidX=true
android.nonTransitiveRClass=true

# ---------------------------------------------------------------------------
# Kotlin
# ---------------------------------------------------------------------------
kotlin.code.style=official

# ---------------------------------------------------------------------------
# 代理（按需取消注释）
#
# Gradle **不读** http_proxy / https_proxy 环境变量，必须在这里显式声明。
# 如果依赖下载一直卡住不动，多半就是缺这几行。
#
# systemProp.http.proxyHost=127.0.0.1
# systemProp.http.proxyPort=7890
# systemProp.https.proxyHost=127.0.0.1
# systemProp.https.proxyPort=7890
# systemProp.http.nonProxyHosts=localhost|127.0.0.1|*.local
# ---------------------------------------------------------------------------
